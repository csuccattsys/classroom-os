    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* 3. Global Framework Canvas Overrides & Flash Minimization */
      html, body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc; /* Locks color to Tailwind's slate-50 layer to eliminate system boot screen flashes */
        margin: 0;
        padding: 0;
        height: 100%;
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom scrollbar optimization for long legislative roster registries */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* Tailwind slate-300 */
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10b981; /* Custom brand hover accent - Tailwind emerald-500 */
      }
    </style>
  </head>
  <body class="h-full text-slate-900 selection:bg-emerald-600 selection:text-white bg-slate-50/50">

    <script type="module" src="/src/main.jsx"></script>
